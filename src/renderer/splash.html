<!doctype html>
<meta charset="utf-8">
<title>Summer Launcher</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; font-family: "Segoe UI", system-ui, sans-serif; }
  img { width: min(560px, 62vw); }
  .bar { width: min(380px, 50vw); height: 3px; background: #ffffff18; border-radius: 3px; overflow: hidden; position: relative; }
  .bar i { position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, #8b5cf6, #c084fc); border-radius: 3px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  p { margin: 0; font-size: 13px; color: #ffffff80; letter-spacing: .03em; }
</style>
<img id="logo" alt="">
<div class="bar"><i></i></div>
<p>Cargando Minecraft…</p>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('logo').src = q.get('logo');
  document.body.style.background = q.get('bg') || '#000';
  document.addEventListener('dblclick', () => window.close()); // salida de emergencia
</script>
